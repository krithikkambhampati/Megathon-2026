[project]
name = "greenhome"
version = "0.1.0"
description = "Green Home Score & Retrofit Engine (Megathon X, PS2, Lloyds)"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    # data frames + parquet
    "pandas==3.0.6",
    "numpy==2.4.6",
    "pyarrow==25.0.1",
    # ML
    "lightgbm==4.7.0",
    "scikit-learn==1.9.1",
    "statsmodels==0.15.0",
    # contracts + config
    "pydantic==2.14.0",
    "pyyaml==6.0.3",
    # EPC <-> PPD address fuzzy match, NEED .xlsx tables
    "rapidfuzz==3.14.6",
    "openpyxl==3.1.5",
    # API + UI
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "streamlit==1.65.0",
    "plotly==7.1.0",
    # prompts, fallback templates, LLM clients
    "jinja2==3.1.6",
    "ollama==0.6.3",
    "openai==3.28.0",
    "joblib==1.6.0",
    # P1 data pipeline: fast EPC parsing, downloads, report tables
    "polars==1.42.1",
    "requests==2.32.5",
    "tabulate==0.10.0",
]

[project.optional-dependencies]
stretch = ["shap==0.51.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "hypothesis==6.168.5", "ruff==0.17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["greenhome", "api", "data_pipeline", "training", "evaluation"]
