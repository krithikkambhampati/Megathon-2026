# P4 LLM layer settings (BUILD_GUIDE P4.1, docs/LLM.md). Environment variables override the keys marked
# "env". Secrets never go here: LLM_API_KEY lives only in .env.
# Decision 2026-10-11: hosted open-weight model on Groq (OpenAI-compatible API) instead of local Ollama.
# Ollama still works as an optional offline fallback (LLM_PROVIDER=ollama + LLM_BASE_URL + LLM_MODEL in .env).
# The provider is NOT set here on purpose: it comes from env LLM_PROVIDER only (ollama | openai_compat), so
# tests and machines without a .env run on templates.

model: openai/gpt-oss-120b         # env LLM_MODEL overrides. Open-weight (Apache-2.0), served by Groq
base_url: https://api.groq.com/openai/v1  # env LLM_BASE_URL (openai_compat: the endpoint's /v1 base URL)
# Offline (Ollama) pick from reports/llm_bench_cachyos-x8664.md (demo laptop, RTX 4050 6 GB):
#   LLM_PROVIDER=ollama LLM_BASE_URL=http://localhost:11434 LLM_MODEL=qwen2.5:7b-instruct-q4_K_M

# Hosted candidates on Groq (each has its own free-tier quota: 1000 requests/day, 8000 tokens/min).
candidates:
  - openai/gpt-oss-120b
  - openai/gpt-oss-20b
  - qwen/qwen3.8-27b

# When the pinned model answers HTTP 429 (free-tier quota), the same request goes to these models in order;
# each has its own quota. If all are rate limited the user gets the checked template answer.
fallback_models:
  - openai/gpt-oss-20b

# Extra request fields per model-id prefix (openai_compat only). gpt-oss is a reasoning model: hidden reasoning
# tokens count toward max_tokens, so keep it short and out of the reply.
request_extra:
  openai/gpt-oss:
    reasoning_effort: low
    include_reasoning: false
  qwen/:
    reasoning_effort: none

# Determinism (BUILD_GUIDE L5)
temperature: 0
seed: 42
num_ctx: 4096                     # ollama only. fact sheet ≲1.5k + system ~0.4k + retry ≈ 2.7k tokens; bench also tries 8192
keep_alive: 2h                    # ollama only. sent on EVERY Ollama request so the model stays loaded mid-demo

# Time limits, seconds
answer_budget_s: 25               # env LLM_ANSWER_BUDGET_S: cap for a WHOLE explain()/chat() answer (UI: 30 s)
call_timeout_s: 30                # env LLM_TIMEOUT_S: hard cap for any single call
call_cap_s:                       # per-prompt caps inside the budget
  router: 4
  whatif_parse: 6
  memory_parse: 6
  answer: 12
min_call_s: 3                     # don't start an LLM call with less than this left
min_retry_s: 7                    # p95 of one LLM attempt (llm_bench, demo laptop); retry only with this left
connect_timeout_s: 5              # reachability check (TLS to a hosted endpoint)
warmup_timeout_s: 30              # first request (an Ollama cold load can need ~120)

# Max tokens per prompt (~250 words ≈ 330–380 visible tokens). On reasoning models (gpt-oss) the hidden
# reasoning counts too, so the caps leave room for it; a reply cut at the cap is never shown.
max_tokens:
  explain: 900
  whatif_answer: 900
  whatif_parse: 400
  memory_parse: 400
  router: 256
  warmup: 1                         # ollama: just load the model
  warmup_hosted: 128                # openai_compat: one tiny real answer

cache_max_entries: 1024           # in-memory LRU of identical requests
ping_cache_s: 30                  # /v1/health is hit on every UI rerun; don't call the API each time
